name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comparison engine (JavaScript)
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Signal-quality checks (no models)
        working-directory: outputs/ecg-reader
        run: |
          pip install numpy==2.3.5 scipy==1.18.1
          python test_ecg_qc.py
      - name: Patient storage and app serving (Python, no models)
        working-directory: outputs/ecg-reader
        run: python test_patient_store.py
      - name: Exchange folder (Python record must match the app's)
        working-directory: outputs/ecg-reader
        run: python test_folder_worker.py
      - name: Choice of neural networks in the installer (no downloads)
        working-directory: outputs/ecg-reader
        run: python test_model_setup.py
      - name: Desktop program rules (no window, no downloads)
        working-directory: outputs/ecg-reader
        run: python test_desktop_program.py
